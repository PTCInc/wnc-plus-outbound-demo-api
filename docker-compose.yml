# Name:        docker-compose.yml
# Description: This Docker Compose configuration defines two services: `postgres` and
# `nodejs`. It orchestrates the deployment of a PostgreSQL database and a Node.js
# application within containers.

#
# Update History:
# 0.0.1: Initial Release
# 0.0.2: Dropped obsolete version field
# 0.0.3: Changes to run nodejs as non-root user on port 8443
#
# Version: 0.0.3
# ----------------------------------------------------------------------------

# Define services
services:
  # PostgreSQL service configuration
  postgres:
    image: postgres:latest
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: materialManagement
    volumes:
    - ./init.sql:/docker-entrypoint-initdb.d/init.sql
  # Node.js service configuration
  nodejs:
    user: "${UID}:${GID}"
    container_name: nodejs
    environment:
    - SERVER_CN
    - SERVER_DNS
    - SERVER_IP
    build:
      context: .
      dockerfile: dockerfileNodeJs
      args:
        UID: ${UID}
        GID: ${GID}
    depends_on:
    - postgres
    ports:
    - "443:8443"
    volumes:
    - ./certificates/:/app/certificates/
